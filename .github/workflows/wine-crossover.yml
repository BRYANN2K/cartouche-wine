name: wine-crossover

# Builds Wine from the CodeWeavers CrossOver sources pinned in
# packaging/wine-crossover/pins.env, checks the result, and on request publishes
# it as a release asset with its SHA-256, the runner manifest entry and a copy
# of the source tarball (the LGPL source offer). No secret is needed.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the build as a release (from the default branch only)
        type: boolean
        default: false
  pull_request:
    paths:
      - packaging/wine-crossover/**
      - packaging/tests/test_wine_crossover.py
      - .github/workflows/wine-crossover.yml

permissions:
  contents: read

concurrency:
  group: wine-crossover-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    name: check the build scripts
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the script tests
        run: python3 -m unittest discover -s packaging/tests -p 'test_wine_crossover.py'

      - name: Dry run of the build
        run: sh packaging/wine-crossover/build.sh --dry-run "$RUNNER_TEMP/wine-dry"

  build:
    name: build Cartouche Wine
    if: github.event_name == 'workflow_dispatch'
    needs: scripts
    # Wine's Unix side is x86_64 code that Rosetta runs, so it is built on x86_64
    runs-on: ${{ vars.WINE_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 300
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the pinned Xcode
        run: |
          . packaging/wine-crossover/pins.env
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Cache the pinned downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/downloads
          key: wine-crossover-downloads-${{ hashFiles('packaging/wine-crossover/pins.env') }}

      - name: Fetch the source tarball, llvm-mingw, Wine Mono and Wine Gecko
        run: |
          . packaging/wine-crossover/pins.env
          sh packaging/wine-crossover/fetch.sh "$CX_SOURCE_URL" "$CX_SOURCE_SHA256" \
            "work/downloads/crossover-sources-$CX_VERSION.tar.gz"
          sh packaging/wine-crossover/fetch.sh "$LLVM_MINGW_URL" "$LLVM_MINGW_SHA256" \
            "work/downloads/llvm-mingw-$LLVM_MINGW_VERSION.tar.xz"
          sh packaging/wine-crossover/fetch.sh "$WINE_MONO_URL" "$WINE_MONO_SHA256" \
            "work/downloads/wine-mono-$WINE_MONO_VERSION-x86.tar.xz"
          sh packaging/wine-crossover/fetch.sh "$WINE_GECKO_X86_URL" "$WINE_GECKO_X86_SHA256" \
            "work/downloads/wine-gecko-$WINE_GECKO_VERSION-x86.tar.xz"
          sh packaging/wine-crossover/fetch.sh "$WINE_GECKO_X86_64_URL" "$WINE_GECKO_X86_64_SHA256" \
            "work/downloads/wine-gecko-$WINE_GECKO_VERSION-x86_64.tar.xz"
          sh packaging/wine-crossover/fetch.sh "$WINE_MONO_LICENSE_URL" "$WINE_MONO_LICENSE_SHA256" \
            "work/downloads/wine-mono-$WINE_MONO_VERSION-COPYING"
          sh packaging/wine-crossover/fetch.sh "$WINE_GECKO_LICENSE_URL" "$WINE_GECKO_LICENSE_SHA256" \
            "work/downloads/wine-gecko-$WINE_GECKO_VERSION-LICENSE"
          sh packaging/wine-crossover/fetch.sh "$WINE_GECKO_LICENSE_HTML_URL" "$WINE_GECKO_LICENSE_HTML_SHA256" \
            "work/downloads/wine-gecko-$WINE_GECKO_VERSION-license.html"

      - name: Install the Homebrew formulas
        run: |
          . packaging/wine-crossover/pins.env
          # shellcheck disable=SC2086
          brew install $BREW_BUILD_DEPS $BREW_LINK_DEPS

      - name: Build
        run: sh packaging/wine-crossover/build.sh "$PWD/work"

      - name: Package
        id: package
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          . packaging/wine-crossover/pins.env
          sh packaging/wine-crossover/package.sh work/install \
            "work/downloads/crossover-sources-$CX_VERSION.tar.gz" out
          echo "tag=$(cat out/tag)" >> "$GITHUB_OUTPUT"
          cat out/manifest-entry.json >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the archive and run wine --version
        run: sh packaging/wine-crossover/verify.sh out/*-x86_64.tar.xz | tee out/verify.txt

      - name: Scan the archive for Game Porting Toolkit files
        run: sh packaging/redist-scan.sh out/*-x86_64.tar.xz

      # Times winecfg's window only when the runner has a GUI session; its logs
      # are in the wine-crossover artifact (boot/)
      - name: Initialize a fresh prefix, run console programs and boot winecfg
        run: |
          mkdir -p "$RUNNER_TEMP/runner"
          tar -xJf out/*-x86_64.tar.xz -C "$RUNNER_TEMP/runner"
          launchctl managername || true
          sh packaging/wine-crossover/boot-check.sh "$RUNNER_TEMP/runner/$(cat out/tag)" out/boot 180

      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wine-crossover
          path: out/
          if-no-files-found: ignore

  publish:
    name: publish the release
    needs: build
    if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wine-crossover
          path: out

      - name: Fetch the source tarball for the source offer
        run: |
          . packaging/wine-crossover/pins.env
          sh packaging/wine-crossover/fetch.sh "$CX_SOURCE_URL" "$CX_SOURCE_SHA256" \
            "out/crossover-sources-$CX_VERSION.tar.gz"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          . packaging/wine-crossover/pins.env
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG is already released; bump BUILD_REVISION in pins.env"
            exit 1
          fi
          tar -xJOf out/"$TAG"-x86_64.tar.xz "$TAG/SOURCE.md" > out/SOURCE.md
          # A prerelease is never "latest", so the app's Sparkle feed is unaffected
          gh release create "$TAG" --prerelease --latest=false \
            --title "Cartouche Wine $CX_VERSION-$BUILD_REVISION" --notes-file out/SOURCE.md \
            out/"$TAG"-x86_64.tar.xz out/"$TAG"-x86_64.tar.xz.sha256 out/manifest-entry.json \
            out/SOURCE.md "out/crossover-sources-$CX_VERSION.tar.gz"
